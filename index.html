<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot-IA | Control USB (Serial)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e2f; color: #ffffff; text-align: center; padding: 10px; margin: 0; }
        .card { background-color: #2b2b40; max-width: 400px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button { padding: 12px 15px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin: 5px; touch-action: manipulation; }
        .btn-connect { background-color: #17a2b8; color: white; width: 100%; font-size: 18px; }
        .btn-cmd { background-color: #007bff; color: white; width: 90px; height: 60px; }
        .btn-stop { background-color: #dc3545; color: white; width: 90px; height: 60px; }
        .btn-toggle { background-color: #ffc107; color: black; width: 100%; margin-top: 10px; }
        .grid-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; justify-items: center; margin-top: 15px; }
        #status { font-weight: bold; margin-bottom: 15px; color: #ff6b6b; }
        .info-text { font-size: 13px; color: #a0a0b0; margin: 10px 0; }
        
        .video-container { position: relative; width: 100%; max-width: 320px; margin: 15px auto; border-radius: 8px; overflow: hidden; display: none; }
        video, canvas { width: 100%; height: auto; border-radius: 8px; }
        canvas { position: absolute; top: 0; left: 0; z-index: 10; }
    </style>
</head>
<body>

<div class="card">
    <h2>Control Robot-IA (USB)</h2>
    <p id="status">Estado: Desconectado</p>
    <button class="btn-connect" onclick="conectarSerial()">Conectar por Cable USB</button>
    <p class="info-text">Comando actual: <span id="cmdSent" style="color:#00ff88; font-weight:bold;">-</span></p>

    <hr style="border-color: #444; margin: 20px 0;">

    <!-- MODO 1: BOTONES -->
    <h3>1. Modo Botones</h3>
    <div class="grid-buttons">
        <div></div>
        <button class="btn-cmd" onclick="enviarComando('ad')">▲</button>
        <div></div>
        
        <button class="btn-cmd" onclick="enviarComando('ga')">◀</button>
        <button class="btn-stop" onclick="enviarComando('stop')">STOP</button>
        <button class="btn-cmd" onclick="enviarComando('gh')">▶</button>
        
        <div></div>
        <button class="btn-cmd" onclick="enviarComando('at')">▼</button>
        <div></div>
    </div>

    <hr style="border-color: #444; margin: 20px 0;">

    <!-- MODO 3: GESTOS DE MANO (Omitimos acelerómetro al usar PC) -->
    <h3>2. Modo Gestos de Mano</h3>
    <button id="btnGestos" class="btn-toggle" onclick="toggleGestos()">Activar Cámara (Gestos)</button>
    <div class="video-container" id="videoContainer">
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="canvasElement"></canvas>
    </div>
    <p class="info-text">Usa tu dedo índice frente a la cámara web.</p>
</div>

<script>
    // --- VARIABLES SERIAL ---
    let puertoSerial = null;
    let escritorSerial = null;
    let ultimoComando = "";

    // --- VARIABLES GESTOS (MEDIAPIPE) ---
    let gestosActivos = false;
    let camera = null;
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('canvasElement');
    const canvasCtx = canvasElement.getContext('2d');

    // ==========================================
    // 1. LÓGICA WEB SERIAL (CABLE USB)
    // ==========================================
    async function conectarSerial() {
        if (!("serial" in navigator)) {
            alert("Tu navegador no soporta Web Serial. Usa Google Chrome o Edge en un PC.");
            return;
        }

        try {
            // Solicita al usuario seleccionar el puerto COM de la ESP32
            puertoSerial = await navigator.serial.requestPort();
            
            // Abre el puerto a 115200 baudios (Debe coincidir con la ESP32)
            await puertoSerial.open({ baudRate: 115200 });
            
            escritorSerial = puertoSerial.writable.getWriter();

            document.getElementById('status').innerText = "Estado: Conectado (Serial USB)";
            document.getElementById('status').style.color = "#00ff88";
        } catch (error) {
            console.error("Error Serial:", error);
            document.getElementById('status').innerText = "Error: " + error.message;
            document.getElementById('status').style.color = "#ff6b6b";
        }
    }

    async function enviarComando(cmd) {
        if (cmd === ultimoComando) return; 
        ultimoComando = cmd;
        document.getElementById('cmdSent').innerText = cmd;

        if (!escritorSerial) return; 
        
        try {
            // C++ espera un salto de línea (\n) al final de cada comando
            const encoder = new TextEncoder();
            await escritorSerial.write(encoder.encode(cmd + "\n"));
        } catch (error) {
            console.error("Error enviando datos:", error);
        }
    }

    // ==========================================
    // 2. LÓGICA GESTOS DE MANO (MediaPipe)
    // ==========================================
    const hands = new window.Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1, 
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
        if (!gestosActivos) return;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            window.drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
            window.drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 2});

            const indexX = landmarks[8].x;
            const indexY = landmarks[8].y;

            let cmd = "stop";
            if (indexY < 0.3) cmd = "ad"; 
            else if (indexY > 0.7) cmd = "at"; 
            else if (indexX < 0.3) cmd = "gh"; 
            else if (indexX > 0.7) cmd = "ga"; 

            enviarComando(cmd);
        } else {
            enviarComando("stop");
        }
        canvasCtx.restore();
    });

    async function toggleGestos() {
        if (!gestosActivos) {
            gestosActivos = true;
            document.getElementById('videoContainer').style.display = "block";
            document.getElementById('btnGestos').innerText = "Desactivar Gestos";
            document.getElementById('btnGestos').style.backgroundColor = "#dc3545";

            canvasElement.width = 320;
            canvasElement.height = 240;

            if (!camera) {
                camera = new window.Camera(videoElement, {
                    onFrame: async () => {
                        if (gestosActivos) await hands.send({image: videoElement});
                    },
                    width: 320, height: 240, facingMode: "user"
                });
            }
            camera.start();
        } else {
            gestosActivos = false;
            document.getElementById('videoContainer').style.display = "none";
            document.getElementById('btnGestos').innerText = "Activar Cámara (Gestos)";
            document.getElementById('btnGestos').style.backgroundColor = "#ffc107";
            if (camera) camera.stop();
            enviarComando("stop");
        }
    }
</script>

</body>
</html>
