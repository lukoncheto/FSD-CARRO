<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Robot-IA | Web Bluetooth</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .card {
            background-color: #2b2b40;
            max-width: 450px;
            margin: auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            touch-action: manipulation; /* Mejora la respuesta táctil en móviles */
        }
        .btn-connect { background-color: #28a745; color: white; width: 80%; font-size: 18px; }
        .btn-cmd { background-color: #007bff; color: white; width: 100px; height: 60px; font-size: 16px; }
        .btn-stop { background-color: #dc3545; color: white; width: 100px; height: 60px; }
        .btn-toggle { background-color: #ffc107; color: black; margin-top: 15px; }
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            justify-items: center;
            margin-top: 20px;
        }
        #status { font-weight: bold; color: #ff6b6b; margin-top: 10px; }
        .orientation-info { margin-top: 15px; font-size: 14px; color: #a0a0b0; }
    </style>
</head>
<body>

<div class="card">
    <h2>Control Robot-IA</h2>
    <p id="status">Estado: Desconectado</p>
    <button class="btn-connect" onclick="conectarBLE()">Conectar BLE</button>

    <hr style="border-color: #444; margin: 20px 0;">

    <!-- MODO 1: BOTONES -->
    <h3>Modo 1: Botones Directos</h3>
    <div class="grid-buttons">
        <div></div>
        <button class="btn-cmd" onclick="enviarComando('ad')">▲ Adelante</button>
        <div></div>
        
        <button class="btn-cmd" onclick="enviarComando('ga')">◀ Giro Ant.</button>
        <button class="btn-stop" onclick="enviarComando('stop')">STOP</button>
        <button class="btn-cmd" onclick="enviarComando('gh')">Giro Hor. ▶</button>
        
        <div></div>
        <button class="btn-cmd" onclick="enviarComando('at')">▼ Atrás</button>
        <div></div>
    </div>

    <hr style="border-color: #444; margin: 20px 0;">

    <!-- MODO 2: ACELERÓMETRO -->
    <h3>Modo 2: Acelerómetro (Inclinación)</h3>
    <button id="btnAce" class="btn-toggle" onclick="toggleAcelerometro()">Activar Acelerómetro</button>
    <div class="orientation-info">
        <p>Beta (Pitch): <span id="pitch">0</span>° | Gamma (Roll): <span id="roll">0</span>°</p>
        <p>Comando enviado: <span id="cmdSent" style="color:#00ff88;">-</span></p>
    </div>
</div>

<script>
    const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

    let caracteristicaBLE = null;
    let acelerometroActivo = false;
    let ultimoComando = "";

    async function conectarBLE() {
        try {
            document.getElementById('status').innerText = "Estado: Buscando...";
            
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'Robot-IA' }],
                optionalServices: [SERVICE_UUID]
            });

            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            caracteristicaBLE = await service.getCharacteristic(CHARACTERISTIC_UUID);

            document.getElementById('status').innerText = "Estado: Conectado a Robot-IA";
            document.getElementById('status').style.color = "#00ff88";
        } catch (error) {
            console.error("Error al conectar:", error);
            document.getElementById('status').innerText = "Error: " + error.message;
            document.getElementById('status').style.color = "#ff6b6b";
        }
    }

    async function enviarComando(cmd) {
        if (!caracteristicaBLE) {
            alert("¡Conecta el Bluetooth primero!");
            return;
        }
        try {
            const encoder = new TextEncoder();
            await caracteristicaBLE.writeValue(encoder.encode(cmd));
            document.getElementById('cmdSent').innerText = cmd;
        } catch (error) {
            console.error("Error al enviar comando:", error);
            document.getElementById('status').innerText = "Error de transmisión";
        }
    }

    async function toggleAcelerometro() {
        if (!acelerometroActivo) {
            // Petición explícita de permisos para sensores en dispositivos móviles (iOS/Android modernos)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        activarSensor();
                    } else {
                        alert("Permiso de sensores denegado.");
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                activarSensor();
            }
        } else {
            acelerometroActivo = false;
            document.getElementById('btnAce').innerText = "Activar Acelerómetro";
            document.getElementById('btnAce').style.backgroundColor = "#ffc107";
            window.removeEventListener('deviceorientation', manejarInclinacion);
            enviarComando("stop");
        }
    }

    function activarSensor() {
        acelerometroActivo = true;
        document.getElementById('btnAce').innerText = "Desactivar Acelerómetro";
        document.getElementById('btnAce').style.backgroundColor = "#dc3545";
        window.addEventListener('deviceorientation', manejarInclinacion, true);
    }

    function manejarInclinacion(event) {
        if (!acelerometroActivo || !caracteristicaBLE) return;

        let pitch = event.beta;   // Adelante / Atrás
        let roll = event.gamma;    // Izquierda / Derecha

        if (pitch === null || roll === null) return;

        document.getElementById('pitch').innerText = Math.round(pitch);
        document.getElementById('roll').innerText = Math.round(roll);

        let nuevoComando = "stop";

        if (pitch < -15) {
            nuevoComando = "ad";
        } else if (pitch > 20) {
            nuevoComando = "at";
        } else if (roll > 20) {
            nuevoComando = "gh";
        } else if (roll < -20) {
            nuevoComando = "ga";
        }

        if (nuevoComando !== ultimoComando) {
            ultimoComando = nuevoComando;
            enviarComando(nuevoComando);
        }
    }
</script>
</body>
</html>
